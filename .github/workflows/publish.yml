name: Publish
on:
  schedule: [{cron: "5 * * * *"}]   # every hour; posts at most one due reel
  workflow_dispatch:
permissions: {contents: write, issues: write}
concurrency: {group: ledger, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt
      - run: python -m pipeline.publish
      - run: python -m pipeline.alerts
        continue-on-error: true
      - run: python -m pipeline.dashboard
      - name: Tell Conor if this run crashed
        if: failure()
        run: python -m pipeline.health --crashed "Publish"
      - name: Save the bot's memory and dashboard
        if: always()
        run: |
          git config user.name "reelbot"; git config user.email "reelbot@users.noreply.github.com"
          git add data docs || true
          git commit -q -m "reelbot: ${{ github.workflow }}" || exit 0
          git pull -q --rebase && git push -q
