name: Daily plan
on:
  workflow_dispatch:
permissions: {contents: write, issues: write}
concurrency: {group: ledger, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FAL_KEY: ${{ secrets.FAL_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      GH_TOKEN: ${{ secrets.GH_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt
      - run: python -m pipeline.tag_clips
      - run: python -m pipeline.sound_sweep
        continue-on-error: true
      - run: python -m pipeline.trend_scan
        continue-on-error: true
      - run: python -m pipeline.insights
        continue-on-error: true
      - run: python -m pipeline.plan_day
      - run: python -m pipeline.cleanup
        continue-on-error: true
      - run: python -m pipeline.health
        continue-on-error: true
      - run: python -m pipeline.dashboard
      - name: Save the bot's memory and dashboard
        if: always()
        run: |
          git config user.name "reelbot"; git config user.email "reelbot@users.noreply.github.com"
          git add data docs || true
          git commit -q -m "reelbot: ${{ github.workflow }}" || exit 0
          for i in 1 2 3 4 5; do
            if git pull -q --rebase -X theirs && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((i * 5))
          done
          exit 1
      - name: Tell Conor if this run crashed
        if: failure()
        run: python -m pipeline.health --crashed "Daily plan"
