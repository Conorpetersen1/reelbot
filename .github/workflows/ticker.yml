name: Ticker
# GitHub's own schedules run hours late or not at all on this repo, so this job keeps time instead:
# it starts Publish every hour at :17, the Daily plan at about 4:17pm Sydney and the Weekly job on Mondays,
# then hands over to a fresh copy of itself before GitHub's 6-hour job limit. Free on a public repo.
# If it ever stops: Actions > Ticker > Run workflow (the schedule below also tries to restart it).
on:
  workflow_dispatch:
  schedule: [{cron: "41 */3 * * *"}]   # backup restart, if GitHub ever runs it
permissions: {actions: write, contents: read}
concurrency: {group: ticker, cancel-in-progress: false}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Start jobs on time for about 5 hours
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          start_if_not_run() {  # workflow file, hours: skip if it already ran (or is running) that recently
            since=$(date -u -d "-$2 hours" +%Y-%m-%dT%H:%M:%SZ)
            n=$(gh run list -R "$REPO" -w "$1" --created ">=$since" --json databaseId -q length)
            if [ "${n:-0}" = "0" ]; then gh workflow run "$1" -R "$REPO" && echo "started $1"; fi
          }
          end=$(( $(date +%s) + 5*3600 + 15*60 ))
          while true; do
            m=$((10#$(date -u +%M))); s=$((10#$(date -u +%S)))
            wait=$(( ((17 - m + 60) % 60) * 60 - s )); [ $wait -le 0 ] && wait=$(( wait + 3600 ))
            [ $(( $(date +%s) + wait )) -ge $end ] && break
            sleep $wait
            gh workflow run publish.yml -R "$REPO" && echo "$(date -u +%H:%M) started publish" || echo "publish start failed"
            h=$(date -u +%H); d=$(date -u +%u)
            # 05:17 UTC = 4:17pm Sydney (summer time). 14:17 UTC Sunday = 1:17am Monday Sydney.
            if [ "$h" = "05" ]; then start_if_not_run daily.yml 20 || true; fi
            if [ "$h" = "14" ] && [ "$d" = "7" ]; then start_if_not_run weekly.yml 100 || true; fi
          done
          gh workflow run ticker.yml -R "$REPO" && echo "handed over to a new ticker"
