# reelbot settings. Change these and commit, and the next run picks them up.

paused: false                       # true = stop posting and generating (stats and alerts keep running)

timezone: Australia/Sydney          # switch to Asia/Tokyo while you're in Niseko if you want Japan-time posting

# Reels per day. Start low: Instagram's trial reel cap varies by account and isn't published.
reels_per_day:
  ai: 3
  real: 2
# Local posting times (one reel per slot, in order). Needs at least ai + real entries.
post_times: ["07:30", "11:30", "15:30", "18:30", "20:30"]

graduation: MANUAL                  # MANUAL = nothing reaches followers unless you graduate it in the app

# Content rules
topic_cooldown_days: 6              # don't reuse the same topic within this many days
real_clip_cooldown_days: 10         # wait this long before reusing a moment of your footage
ai_clip_max_uses: 2                 # retire an AI clip after this many reels (reuses get a new crop/zoom/speed)
fit_min_score: 3                    # every finished reel is watched; below this (1-5) it's swapped for another
fit_spares: 3                       # extra reels planned per type so misfits can be replaced

# AI clips (fal.ai). Check the model pages on fal.ai if a name changes.
ai_clips_per_week: 14          # ~21 AI reels a week, each clip used at most twice
mascot_style: >-
  blocky low-poly 3D cartoon snowboarder character, chunky square proportions, toy-like,
  clean stylised game-like render, vertical 9:16 framing
# Your real kit, so the mascot looks like you (edit if you change gear)
mascot_outfit: >-
  black ski helmet, pink-red mirrored goggles, loose sand/beige hooded snow jacket, black gloves,
  black snow pants, black snowboard boots, white snowboard with pink-red accents
image_model: fal-ai/flux/dev                              # mascot designs
scene_model: fal-ai/flux-pro/kontext                      # puts the chosen mascot into each scene
video_model: fal-ai/kling-video/v2.5-turbo/pro/image-to-video
video_seconds: 5

# Hard spending cap for fal.ai. The bot estimates its spend and stops generating for the rest of the month
# once it reaches this. Existing clips keep being reused, so posting carries on.
fal_monthly_budget_usd: 40
fal_cost_estimate_usd: {image: 0.04, video_clip: 0.40}

# Claude (writing + clip tagging)
claude_model: claude-sonnet-5-5

# Gemini (optional second AI: watches trend videos with sound, double-checks every reel).
# Tried in order; the first one Google still serves is used.
gemini_models: [gemini-3.8-flash, gemini-3.7-flash, gemini-3.5-flash, gemini-3-flash-preview, gemini-2.5-flash]

# When your API keys or credits expire (YYYY-MM-DD). The dashboard warns you a week before.
# After renewing a key, update the GitHub secret and change or delete the date here.
key_expiry:
  ANTHROPIC_API_KEY: "2026-12-22"
  FAL_KEY: "2026-12-22"

# The follower learner (see pipeline/learn.py). It picks topics, clips, styles, hooks, sounds and posting
# times to maximise followers, learning from your account's hourly follower count.
learning:
  candidate_times: ["07:30", "09:00", "11:30", "13:00", "15:30", "17:30", "18:30", "19:30", "20:30", "21:30"]
  trust_follows_after: 60     # until ~60 followers have been attributed, it leans on engagement (views/shares/saves)
  fresh_trend_boost: 1.5      # head start for new trend/analyst ideas while they're fresh
  retire_below: -0.4          # topics clearly worse than average for followers...
  retire_sure: 0.8            # ...with this confidence...
  retire_min_reels: 4         # ...after at least this many reels get rested for retire_days
  retire_days: 30
  analyst_min_reels: 10       # weekly analyst starts once this many reels are 3+ days old
  analyst_new_topics: 4

# Sounds from Drive/audio
sounds:
  use_on: all             # all = every reel, ai = mascot reels only
  sound_volume: 0.9
  clip_sound_volume: 0.25 # your clip's own sound underneath (0 = off)
  fresh_days: 14          # sounds added in the last 14 days get used about 4x as often
  max_age_days: 45        # sounds older than this are retired from rotation

# Drive cleanup (files go to Drive's bin)
cleanup:
  keep_posted_days: 14        # rendered reels in 'posted' (they're already on Instagram)
  keep_recordings_days: 30    # analysed trend and sound-sweep recordings

# View alerts: you get a GitHub notification (email / GitHub app) when a trial reel passes each of these
alert_views: [2000, 10000, 50000]

# Instagram
ig_api_version: v25.0

# Google Drive folder names (created inside the folder you share with the bot)
drive:
  real: real            # you drop your own clips here
  ai_library: ai_library
  queue: queue          # tomorrow's reels; delete one to veto it
  posted: posted
  mascot: mascot        # mascot options; delete all but your favourite
  mascot_source: mascot_source  # put a photo of yourself here to base the mascot on
  audio: audio          # sounds to put on reels: audio files or screen recordings (sound gets pulled out)
  sound_sweeps: sound_sweeps   # screen recordings of you scrolling trending audio
  sound_sweeps_done: sound_sweeps_done
  trends: trends        # save trending reels here from your phone (screen recording or download)
  trends_done: trends_done

# Trend inbox
trend_boost_days: 7     # new trend-based ideas get picked more often for this many days
trend_ai_clips: 1       # AI clips made straight away for each new trend idea (trends go stale fast)
